name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Uygulama adı ve geri tuşu ayarı
        run: sed -i 's#<string name="app_name">.*</string>#<string name="app_name">Glassly</string>#' android/app/src/main/res/values/strings.xml
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Glassly-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
