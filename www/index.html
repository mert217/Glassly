<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Glassly</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#f3f5fb;--bg2:#e4ebff;--card:rgba(255,255,255,.86);--t:#1b2240;--m:#6a7594;--a:#4f7cff;--a2:#8a6bff;--line:rgba(27,34,64,.09);--sh:0 6px 22px rgba(60,80,150,.12);--ok:#1fa97a;--bad:#e5484d;--bar:rgba(255,255,255,.92)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151b30;--bg2:#1f2750;--card:rgba(36,45,82,.78);--t:#eaf0ff;--m:#9ba8cb;--line:rgba(255,255,255,.09);--sh:0 6px 22px rgba(0,0,0,.28);--ok:#4fd1a5;--bad:#ff7a85;--bar:rgba(28,36,68,.94)}}
:root[data-theme=dark]{--bg:#151b30;--bg2:#1f2750;--card:rgba(36,45,82,.78);--t:#eaf0ff;--m:#9ba8cb;--line:rgba(255,255,255,.09);--sh:0 6px 22px rgba(0,0,0,.28);--ok:#4fd1a5;--bad:#ff7a85;--bar:rgba(28,36,68,.94)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;overflow:hidden}
body{font:16px/1.45 system-ui,Roboto,sans-serif;color:var(--t);background:radial-gradient(120% 60% at 0 0,var(--bg2),transparent 70%),var(--bg);user-select:none}
#login,#pin{position:fixed;inset:0;display:none;place-items:center;padding:20px;overflow:auto}
.box{width:100%;max-width:380px;background:var(--card);border-radius:28px;padding:28px 24px;box-shadow:var(--sh);animation:up .4s ease}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.logo{font-size:34px;font-weight:800;letter-spacing:-1px;background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--m);margin:2px 0 18px}
input,textarea{width:100%;font:inherit;user-select:text;color:var(--t);background:rgba(127,140,180,.12);border:2px solid transparent;border-radius:16px;padding:13px 15px;margin:5px 0 12px;outline:0}
input:focus,textarea:focus{border-color:var(--a)}label{font-size:13px;color:var(--m);font-weight:600}
label.chk{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-weight:500}label.chk input{width:22px;height:22px;margin:0}
button{font:inherit;font-weight:700;border:0;border-radius:16px;padding:13px 18px;color:#fff;background:linear-gradient(90deg,var(--a),var(--a2));box-shadow:0 6px 16px rgba(79,124,255,.35)}
button:active{transform:scale(.97)}button.full{width:100%}button.soft{background:rgba(127,140,180,.16);color:var(--t);box-shadow:none}
.err{color:var(--bad);min-height:22px;font-size:14px;margin-bottom:6px}
#app{position:fixed;inset:0;display:none;flex-direction:column}
#hd{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 18px 8px}
#ttl{flex:1;font-size:26px;font-weight:800;letter-spacing:-.5px}#back{font-size:28px;line-height:1;padding:0 6px 0 0;color:var(--a);display:none;background:none;box-shadow:none}
#ptr{position:absolute;left:50%;top:70px;margin-left:-18px;width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;transform:translateY(-60px);z-index:3;pointer-events:none}
#main{flex:1;overflow-y:auto;padding:4px 16px 24px;overscroll-behavior:contain;animation:fade .25s}
@keyframes fade{from{opacity:.3}}
#tabs{display:flex;background:var(--bar);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(40,60,120,.12);border-radius:24px 24px 0 0}
#tabs a{flex:1;text-align:center;padding:6px 0;border-radius:16px;color:var(--m);font-size:11px;font-weight:600}
#tabs a i{display:block;font-style:normal;font-size:22px;line-height:1.2;transition:.2s}#tabs a.on{color:var(--a)}#tabs a.on i{transform:translateY(-2px) scale(1.15)}
.c{background:var(--card);border-radius:22px;padding:15px 17px;margin-bottom:12px;box-shadow:var(--sh);animation:up .35s both}.c.tap:active{transform:scale(.985)}
.c b{display:block}.c small,.mu{color:var(--m)}
h3{margin:20px 4px 10px;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--m)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 11px;border-radius:99px;background:rgba(79,124,255,.15);color:var(--a);margin:7px 6px 0 0}.pill.ok{background:rgba(31,169,122,.16);color:var(--ok)}.pill.bad{background:rgba(229,72,77,.15);color:var(--bad)}
.hero{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;box-shadow:0 12px 28px rgba(79,124,255,.35)}.hero small{color:rgba(255,255,255,.85)}.hero b{font-size:21px}
.les{display:flex;gap:12px;align-items:center;border-left:6px solid hsl(var(--h) 70% 58%)}.les .tm{min-width:62px;text-align:center;font-weight:700;font-size:13px;line-height:1.2;padding:8px 6px;border-radius:14px;background:hsl(var(--h) 75% 55%/.16)}
.les.now{box-shadow:0 0 0 2px var(--a),var(--sh)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:99px;background:var(--card);font-weight:600;font-size:14px;box-shadow:var(--sh);color:var(--m)}.chip.on{background:linear-gradient(90deg,var(--a),var(--a2));color:#fff}.chip.td{outline:2px solid var(--a)}
.seg{display:flex;background:rgba(127,140,180,.15);border-radius:14px;padding:4px;margin-bottom:12px}.seg a{flex:1;text-align:center;padding:8px;border-radius:11px;font-weight:600;color:var(--m)}.seg a.on{background:var(--card);color:var(--t);box-shadow:var(--sh)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.kpis .c{margin:0;padding:13px 15px}.kpi{font-size:26px;font-weight:800}.kpis small{font-size:12px}
.bar{height:8px;border-radius:99px;background:rgba(127,140,180,.2);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--a2))}
.empty{text-align:center;color:var(--m);padding:36px 10px}.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--a);animation:sp .9s linear infinite;margin:48px auto}@keyframes sp{to{transform:rotate(360deg)}}
.tw{overflow-x:auto;border-radius:18px}table{border-collapse:separate;border-spacing:4px;width:100%;font-size:13px}th{color:var(--m);font-size:12px}td{background:var(--card);border-radius:10px;padding:7px 8px;min-width:96px;vertical-align:top}td.sl{position:sticky;left:0;font-weight:700;color:var(--a);min-width:78px}
.row{display:flex;align-items:center;gap:14px}.row .ic{font-size:26px}.row .gt{margin-left:auto;color:var(--m);font-size:20px}
.ov{position:fixed;inset:0;background:rgba(10,16,40,.5);z-index:9;display:flex;align-items:flex-end;animation:fade .2s}
.sh{width:100%;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:slide .28s cubic-bezier(.2,.8,.2,1)}@keyframes slide{from{transform:translateY(100%)}}
.gr{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px;background:rgba(127,140,180,.4)}.sh h2{margin:0 0 4px;font-size:21px}
.msg{white-space:pre-wrap;margin:12px 0;user-select:text}a.f{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:16px;padding:13px 15px;margin:8px 0;font-weight:600;color:var(--a)}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;font-size:26px;padding:0;z-index:4;display:none}
.res div{padding:11px 13px;border-radius:14px;background:var(--card);margin-bottom:6px}.res div.sel{outline:2px solid var(--a)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b2240;color:#fff;padding:10px 18px;border-radius:99px;z-index:20;display:none;font-size:14px}
</style></head><body>
<section id="login"><div class="box"><div class="logo">Glassly</div><p class="sub">Okul panelin, cebinde. 👋</p>
<label>Okul adresi</label><input id="base" value="https://tedemkolejiobs.com" autocapitalize="off" autocorrect="off">
<label>TC kimlik no</label><input id="tc" inputmode="numeric" autocomplete="username">
<label>Şifre</label><input id="pw" type="password" autocomplete="current-password">
<label class="chk"><input id="rem" type="checkbox"> Beni hatırla (PIN ile korunur)</label>
<div class="err" id="err"></div><button class="full" id="go">Giriş yap</button></div></section>
<section id="pin"><div class="box"><div class="logo">Glassly</div><p class="sub">Devam etmek için PIN'ini gir 🔒</p>
<input id="pinin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" style="text-align:center;font-size:26px;letter-spacing:10px">
<div class="err" id="pinerr"></div><button class="full" id="pinok">Aç</button><button class="full soft" id="pinforget" style="margin-top:10px">PIN'imi unuttum</button></div></section>
<section id="app"><div id="ptr">⟳</div><div id="hd"><button id="back">‹</button><div id="ttl"></div></div><div id="main"></div><button class="fab" id="fab">✍️</button><nav id="tabs"></nav></section>
<div id="toast"></div>
<script src="data.js"></script><script src="app.js"></script></body></html>
